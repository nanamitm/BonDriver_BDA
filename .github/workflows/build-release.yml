name: Build and release

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build
        shell: pwsh
        run: ./tools/build-tbs.ps1

      - name: Build the board mode tool
        shell: cmd
        run: tools\build-board-mode.cmd

      - name: Tests
        shell: cmd
        run: |
          call tools\test-tbs6812.cmd || exit /b 1
          call tools\test-opticast.cmd || exit /b 1

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 7) }
          $zip = ./tools/package-release.ps1 -Version $version
          "PACKAGE=$(Split-Path $zip -Leaf)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BonDriver_BDA-TBS6812-win64
          path: ${{ env.PACKAGE }}
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.PACKAGE }}

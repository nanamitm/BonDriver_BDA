; Settings of BonDriver_TBS6812.dll, a copy of BonDriver_dantto4k.dll from dantto4k.
; The application selects this BonDriver. See doc/tbs6812-all.md.
[bondriver]
bondriverPath=.\tbs6812-all\BonDriver_TBS6812_Inner.dll
; UHF, Opticast, BS and CS110 are already MPEG-2 TS. Only tuning space 4 (BS4K8K) is converted.
passthroughSpaces=0,1,2,3

[acas]
; Name of the smart card reader for ISDB-S3, as listed by dantto4k --listSmartCardReader.
smartCardReaderName=
